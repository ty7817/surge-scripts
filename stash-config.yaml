# Stash 配置 v5 | 更新: 2026-11-15
mode: rule
log-level: warning
ipv6: false
allow-lan: false
dns:
  enable: true
  ipv6: false
  # 按 Stash 官方《编写高效的配置文件》：移动端 DoH/DoT 更耗系统资源且延迟更高，
  # 建议只配 1-2 个国内 UDP DNS；Fake-IP 已避免为代理请求做本地解析。
  nameserver:
  - 223.5.5.5
  - 119.29.29.29
  fake-ip-range: 198.18.0.1/16
  nameserver-policy:
    +.taobao.com: 223.5.5.5
    +.tmall.com: 223.5.5.5
    +.alicdn.com: 223.5.5.5
    +.aliyun.com: 223.5.5.5
    +.alipay.com: 223.5.5.5
    +.mi.com: 223.5.5.5
    +.xiaomi.com: 223.5.5.5
    +.tencent.com: 119.29.29.29
    +.qq.com: 119.29.29.29
    +.weixin.com: 119.29.29.29
    +.qpic.cn: 119.29.29.29
    +.jd.com: 119.29.29.29
    +.bilibili.com: 119.29.29.29
    hdslb.com: 119.29.29.29
    +.163.com: 119.29.29.29
    +.douyin.com: 119.29.29.29
    +.bytedance.com: 119.29.29.29
    +.feishu.cn: 119.29.29.29
    +.zhihu.com: 119.29.29.29
    +.weibo.com: 119.29.29.29
    dl.google.com: 119.29.29.29
    dl.l.google.com: 119.29.29.29
    update.googleapis.com: 119.29.29.29
    +.dl.playstation.net: 119.29.29.29
  fake-ip-filter:
  - +.stun.*.*
  - +.stun.*.*.*
  - +.stun.playstation.net
  - '*.stun.l.google.com'
  - xbox.*.microsoft.com
  - '*.*.xboxlive.com'
  - '*.srv.nintendo.net'
  - '*.msftncsi.com'
  - '*.msftconnecttest.com'
  - '*.battlenet.com.cn'
  - '*.battlenet.com'
  - '*.blzstatic.cn'
  - '*.battle.net'
  - '*.turn.twilio.com'
  - '*.stun.twilio.com'
  - stun.syncthing.net
  - '*.whatsapp.com'
  - '*.whatsapp.net'
  - '*.cdn.discordapp.com'
  - '*.discord.gg'
  - '*.steamserver.net'
  - '*.valve.net'
  - '*.steamcommunity.com'
  - '*.crashlytics.com'
  - captive.apple.com
  - seed-sequoia.siri.apple.com
  - www.abchina.com.cn
  - '*.lan'
  - '*.local'
  - +.localdomain
