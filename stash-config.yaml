  url-rewrite:
  - ^https?://(www\.)?g\.cn https://www.google.com 302
  - ^https?://(www\.)?google\.cn https://www.google.com 302
  - ^https?://(www\.)?youtube\.com/s/yt/ https://www.youtube.com 302
  - ^https?://(www\.)?youtube\.com/(watch\?.*)&feature=share(.*) https://www.youtube.com/watch$1$2
  - ^https?://(www\.)?google\.com/url\?q=(.*) https://$2 302
  header-rewrite:
  - ^https://(www\.)?github\.com/ request-replace Accept-Language en-us
  - ^https://(raw|gist)\.githubusercontent\.com/ request-replace Accept-Language en-us
  - ^https://(web\.)?telegram\.org/ request-replace Accept-Language zh-cn
  - ^https://(twitter\.com|x\.com)/ request-replace Accept-Language en-us
  - ^https://(www\.)?reddit\.com/ request-replace Accept-Language en-us
