geoip-maxmind-url = https://rules.aapls.com/GeoIP/Country.mmdb
disable-geoip-db-auto-update = false
exclude-simple-hostnames = true
dns-server = 223.5.5.5, 223.6.6.6, 119.29.29.29, 180.76.76.76
