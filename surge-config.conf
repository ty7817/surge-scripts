[General]
loglevel = warning
show-error-page-for-reject = true
hide-vpn-icon = true
allow-wifi-access = true
all-hybrid = false
wifi-assist = true
ipv6 = false
ipv6-vif = disabled
block-quic = true
test-timeout = 8
internet-test-url = http://connect.rom.miui.com/generate_204
