udp-policy-not-supported-behaviour = reject
udp-priority = true
always-raw-tcp-hosts = *.baidu.com, *.qq.com, *.weibo.com, *.taobao.com, *.tmall.com, *.jd.com, *.alicdn.com, *.aliyun.com, *.mi.com, *.xiaomi.com, *.sina.com.cn, *.163.com, *.bilibili.com, *.douyin.com
