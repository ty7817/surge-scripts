[URL Rewrite]
# --- Google 重定向 ---
^https?://(www.)?g.cn https://www.google.com 302
^https?://(www.)?google.cn https://www.google.com 302
# --- YouTube 优化 ---
^https?://(www.)?youtube.com/s/yt/ https://www.youtube.com 302
# --- GitHub 加速 ---
^https?://raw.githubusercontent.com/(.*) https://raw.githubusercontent.com/$302
# --- 去除跟踪参数 ---
^https?://(www.)?youtube.com/(watch\?.*)&feature=share(.*) https://www.youtube.com/watch$1$2 302

# --- 国内服务优化（新增）---
^https?://(www.)?bilibili.com/watchlater/(.*) https://www.bilibili.com 302
^https?://ac.qq.com/(.*) https://ac.qq.com 302

# --- 去除多余重定向（新增）---
^https?://(www.)?google.com/url\?q=(.*) https://$2 302

[Header Rewrite]
# --- GitHub 语言优化 ---
http-request ^https://(www\.)?github\.com/ header-replace Accept-Language en-us
http-request ^https://(raw|gist)\.githubusercontent\.com/ header-replace Accept-Language en-us
# --- YouTube 画质优化 ---
http-response ^https://(www\.)?youtube\.com/ header-replace Content-Type text/html
# --- Telegram Web 优化 ---
http-request ^https://(web\.)?telegram\.org/ header-replace Accept-Language zh-cn
# --- Reddit 优化（新增）---
http-request ^https://(www\.)?reddit\.com/ header-replace Accept-Language en-us
# --- Twitter/X 优化（新增）---
http-request ^https://(twitter\.com|x\.com)/ header-replace Accept-Language en-us
# --- Wikipedia 优化（新增）---
http-request ^https://(.*\.)?wikipedia\.org/ header-replace Accept-Language zh-cn,zh;q=0.9,en;q=0.8
# --- Google 搜索优化（新增）---
http-request ^https://(www\.)?google\.com/search header-replace Accept-Language zh-cn,zh;q=0.9,en;q=0.8
# --- 去除网页缓存（新增，开发调试用）---
http-response ^https://(www\.)?github\.com/ header-replace Cache-Control no-cache

