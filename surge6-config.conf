[MITM]
# 首次使用：到 Surge → MITM →「生成新的 CA」→ 安装描述文件并在
# 「通用 → 关于本机 → 证书信任设置」里信任。ca-p12 / ca-passphrase 不在公开仓库中，请在 Surge → MITM →「生成新的 CA」由 App 本地写回。
# hostname 只保留真正需要解密的主机：目前仅 Sub-Store
skip-server-cert-verify = true
h2 = true
# 只保留 Sub-Store 需要解密的一台主机。v2 解密的 github.com / x.com / reddit.com /
# google.cn 等仅服务于"改请求头语言"和"g.cn 跳转"，收益极低，却把证书面扩大了 12 倍
