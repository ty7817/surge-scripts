# 微信/腾讯系：先钉死直连，避免任何规则集变动把通话流量带走
DOMAIN-SUFFIX,weixin.qq.com,DIRECT
DOMAIN-SUFFIX,wechat.com,DIRECT
DOMAIN-SUFFIX,weixinbridge.com,DIRECT
DOMAIN-SUFFIX,gtimg.com,DIRECT
DOMAIN-SUFFIX,qpic.cn,DIRECT
# 微信通话兜底（v4）：不让任何 UDP 进入代理，排除"代理 UDP 会话超时导致挂断"
# 代价：Telegram 语音/视频、部分游戏 UDP 也会直连；需要时删掉 PROTOCOL,UDP,DIRECT 这一行即可
AND,((PROTOCOL,UDP), (DOMAIN-SUFFIX,telegram.org)),电报信息
PROTOCOL,UDP,DIRECT
# 腾讯 ASN 直连：微信语音/视频的媒体节点多为腾讯网段，按 ASN 兜住，
# 即使域名没命中、IP 也不在 GeoIP CN 库里，也仍走直连
IP-ASN,45090,DIRECT,no-resolve
IP-ASN,132203,DIRECT,no-resolve
IP-ASN,132591,DIRECT,no-resolve
# 国内裸 IP 提前直连：不依赖 GEOIP 库是否收录，减少"国内 App 走代理"导致的卡顿
GEOIP,CN,DIRECT,no-resolve

