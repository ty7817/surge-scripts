# Quantumult X 配置（由 ty7817/surge-scripts/surge-config.conf 迁移）
# 说明：
# 1. Surge 的 [Script] 通用脚本、[Panel] 面板、Sub-Store Core 拦截脚本与 QX 脚本接口不通用，未迁移；
#    Sub-Store 请在 QX「订阅」里直接添加订阅链接。
# 2. Surge 的 ca-p12/ca-passphrase 无法直接搬入 QX，MITM 证书需在 QX 内重新生成并信任。
# 3. 区域分组用节点名正则（server-tag-regex）筛选；订阅分组用订阅 tag（resource-tag-regex）筛选。

