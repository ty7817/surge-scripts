^https?://(www\.)?g\.cn https://www.google.com 302
^https?://(www\.)?google\.cn https://www.google.com 302
^https?://(www\.)?youtube\.com/s/yt/ https://www.youtube.com 302
^https?://(www\.)?youtube\.com/(watch\?.*)&feature=share(.*) https://www.youtube.com/watch$1$2 302
^https?://(www\.)?google\.com/url\?q=(.*) https://$2 302
^https://(www\.)?github\.com/ header-replace Accept-Language: en-us
^https://(raw|gist)\.githubusercontent\.com/ header-replace Accept-Language: en-us
^https://(web\.)?telegram\.org/ header-replace Accept-Language: zh-cn
^https://(twitter\.com|x\.com)/ header-replace Accept-Language: en-us
^https://(www\.)?reddit\.com/ header-replace Accept-Language: en-us

