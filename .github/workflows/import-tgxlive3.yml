name: import-tgxlive3
on:
  push:
    paths:
      - '.github/workflows/import-tgxlive3.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        run: |
          curl -sL --fail -o tgx-live3.js "https://aka.doubaocdn.com/s/Rx1KkePKzp"
          wc -c tgx-live3.js
      - name: commit
        run: |
          git config user.name ty7817
          git config user.email 119729860+ty7817@users.noreply.github.com
          git add tgx-live3.js
          git commit -m "add tgx live panel v3 (node fallback)" || true
          git push || true
