name: fix-jsdelivr-links
on:
  push:
    paths:
      - .github/workflows/fix-jsdelivr-links.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rewrite and commit
        run: |
          grep -rl jsdelivr --include='*.sgmodule' --include='*.js' --include='*.md' . | xargs -r perl -pi -e 's{https://(?:cdn|fastly)\.jsdelivr\.net/gh/([^/]+)/([^/\s@]+)@([^/\s]+)/}{https://raw.githubusercontent.com/$1/$2/$3/}g'
          echo '--- remaining ---'
          grep -rn jsdelivr --include='*.sgmodule' . || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: rewrite jsDelivr script URLs to raw"
          git rm -q .github/workflows/fix-jsdelivr-links.yml
          git commit -m "chore: remove one-off link fixer"
          git push
