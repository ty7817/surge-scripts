name: import-tgpair3
on:
  push:
    paths:
      - '.github/workflows/import-tgpair3.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        run: |
          curl -sL --fail -o tg-panel.js "https://aka.doubaocdn.com/s/fOQrWMec76"
          curl -sL --fail -o tg-auto.js "https://aka.doubaocdn.com/s/oUUEjynTHU"
          wc -c tg-panel.js tg-auto.js
      - name: commit
        run: |
          git config user.name ty7817
          git config user.email 119729860+ty7817@users.noreply.github.com
          git add tg-panel.js tg-auto.js
          git commit -m "add quality hint and lower throughput threshold" || true
          git push || true
