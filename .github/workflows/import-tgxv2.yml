name: import-tgxv2
on:
  push:
    paths:
      - '.github/workflows/import-tgxv2.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        run: |
          curl -sL --fail -o tgx-opt-v2.js "https://aka.doubaocdn.com/s/u5oY9oDsmy"
          curl -sL --fail -o tgx-panel-v2.js "https://aka.doubaocdn.com/s/959cc2CD2M"
          wc -c tgx-opt-v2.js tgx-panel-v2.js
      - name: commit
        run: |
          git config user.name ty7817
          git config user.email 119729860+ty7817@users.noreply.github.com
          git add tgx-opt-v2.js tgx-panel-v2.js
          git commit -m "add tgx v2 scripts under new paths" || true
          git push || true
