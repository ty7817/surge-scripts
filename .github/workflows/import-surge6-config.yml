name: import-surge6-config
on:
  push:
    paths:
      - .github/workflows/import-surge6-config.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download profile
        run: curl -fsSL "https://aka.doubaocdn.com/s/tUCNRJql8v" -o surge6-config.conf
      - name: Verify
        run: |
          test -s surge6-config.conf
          grep -q '\[Proxy Group\]' surge6-config.conf
          wc -c surge6-config.conf
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add surge6-config.conf
          git diff --cached --quiet || git commit -m "Add Surge 6 profile"
          git push
