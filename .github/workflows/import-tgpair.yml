name: import-tgpair
on:
  push:
    paths:
      - '.github/workflows/import-tgpair.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        run: |
          curl -sL --fail -o tg-auto.js "https://aka.doubaocdn.com/s/CpggTtYXSa"
          curl -sL --fail -o tg-panel.js "https://aka.doubaocdn.com/s/4La8oZ1GKV"
          wc -c tg-auto.js tg-panel.js
      - name: commit
        run: |
          git config user.name ty7817
          git config user.email 119729860+ty7817@users.noreply.github.com
          git add tg-auto.js tg-panel.js
          git commit -m "add telegram auto cron and panel scripts" || true
          git push || true
