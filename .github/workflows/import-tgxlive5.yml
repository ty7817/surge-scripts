name: import-tgxlive5
on:
  push:
    paths:
      - '.github/workflows/import-tgxlive5.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        run: |
          curl -sL --fail -o tgx-live5.js "https://aka.doubaocdn.com/s/2ZLrFXTNsQ"
          wc -c tgx-live5.js
      - name: commit
        run: |
          git config user.name ty7817
          git config user.email 119729860+ty7817@users.noreply.github.com
          git add tgx-live5.js
          git commit -m "add tgx live panel v5 (multi test url)" || true
          git push || true
