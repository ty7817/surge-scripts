name: import-tgxlive10
on:
  push:
    paths:
      - '.github/workflows/import-tgxlive10.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        run: |
          curl -sL --fail -o tgx-live10.js "https://aka.doubaocdn.com/s/QjtVQB4WoE"
          wc -c tgx-live10.js
      - name: commit
        run: |
          git config user.name ty7817
          git config user.email 119729860+ty7817@users.noreply.github.com
          git add tgx-live10.js
          git commit -m "add tgx live panel v10 (name-based group pick)" || true
          git push || true
