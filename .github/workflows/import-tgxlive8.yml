name: import-tgxlive8
on:
  push:
    paths:
      - '.github/workflows/import-tgxlive8.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        run: |
          curl -sL --fail -o tgx-live8.js "https://aka.doubaocdn.com/s/QggUEf1YPW"
          wc -c tgx-live8.js
      - name: commit
        run: |
          git config user.name ty7817
          git config user.email 119729860+ty7817@users.noreply.github.com
          git add tgx-live8.js
          git commit -m "add tgx live panel v8 (include smart group candidates)" || true
          git push || true
