name: import-tgxlive6
on:
  push:
    paths:
      - '.github/workflows/import-tgxlive6.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        run: |
          curl -sL --fail -o tgx-live6.js "https://aka.doubaocdn.com/s/Eth0sZjc5x"
          wc -c tgx-live6.js
      - name: commit
        run: |
          git config user.name ty7817
          git config user.email 119729860+ty7817@users.noreply.github.com
          git add tgx-live6.js
          git commit -m "add tgx live panel v6 (flexible member match)" || true
          git push || true
