name: import-tgx
on:
  push:
    paths:
      - '.github/workflows/import-tgx.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        run: |
          curl -sL --fail -o tgx-speed-opt.js "https://aka.doubaocdn.com/s/KvncUHGbfU"
          wc -c tgx-speed-opt.js
      - name: commit
        run: |
          git config user.name ty7817
          git config user.email 119729860+ty7817@users.noreply.github.com
          git add tgx-speed-opt.js
          git commit -m "update tgx script v2" || true
          git push || true
