name: import-tgxlive2
on:
  push:
    paths:
      - '.github/workflows/import-tgxlive2.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        run: |
          curl -sL --fail -o tgx-live2.js "https://aka.doubaocdn.com/s/8KsMLw3Bth"
          wc -c tgx-live2.js
      - name: commit
        run: |
          git config user.name ty7817
          git config user.email 119729860+ty7817@users.noreply.github.com
          git add tgx-live2.js
          git commit -m "add tgx live panel v2 (auto-detect groups)" || true
          git push || true
