name: import-potatso
on:
  push:
    paths:
      - '.github/workflows/import-potatso.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        run: |
          curl -sL --fail -o potatso-config.yaml "https://aka.doubaocdn.com/s/B1Vc5rDx9T"
          wc -c potatso-config.yaml
      - name: commit
        run: |
          git config user.name ty7817
          git config user.email 119729860+ty7817@users.noreply.github.com
          git add potatso-config.yaml
          git commit -m "add: potatso-config.yaml" || true
          git push || true
