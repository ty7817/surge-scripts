name: import-tgxlive7
on:
  push:
    paths:
      - '.github/workflows/import-tgxlive7.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        run: |
          curl -sL --fail -o tgx-live7.js "https://aka.doubaocdn.com/s/fPQdycMzn5"
          wc -c tgx-live7.js
      - name: commit
        run: |
          git config user.name ty7817
          git config user.email 119729860+ty7817@users.noreply.github.com
          git add tgx-live7.js
          git commit -m "add tgx live panel v7 (api.x.com probe)" || true
          git push || true
