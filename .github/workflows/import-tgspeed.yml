name: import-tgspeed
on:
  push:
    paths:
      - '.github/workflows/import-tgspeed.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        run: |
          curl -sL --fail -o tg-speed.js "https://aka.doubaocdn.com/s/DZntvx1FcA"
          wc -c tg-speed.js
      - name: commit
        run: |
          git config user.name ty7817
          git config user.email 119729860+ty7817@users.noreply.github.com
          git add tg-speed.js
          git commit -m "add telegram-only speed panel" || true
          git push || true
